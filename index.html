<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9e1" />
    <meta name="description" content="Drop soft jellies on a plate and squish them." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Jelly Lab</title>
  </head>
  <body>
    <canvas id="stage" tabindex="0" aria-label="Jelly plate. Drag a jelly to squish it, drag elsewhere to look around."></canvas>

    <header class="masthead">
      <div class="label">Soft body sandbox</div>
      <h1><span>Jelly</span> <span>Lab</span></h1>
      <p>Drop one in. Squish it. Throw it at the others.</p>
    </header>

    <div class="status" id="status"><span class="dot"></span><span id="statusText">Setting the table</span></div>

    <aside class="panel" id="panel">
      <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true" aria-controls="panelBody">
        <span class="label">Controls</span><span class="chev" aria-hidden="true">▾</span>
      </button>
      <section class="shelf" aria-label="Drop a jelly">
        <div class="label">Drop a jelly</div>
        <div class="shelf-grid" id="shelf"></div>
      </section>
      <div class="panel-body" id="panelBody">
        <section>
          <label class="slider"><span class="label">Firmness</span><output id="firmOut"></output>
            <input type="range" id="firm" min="0" max="100" value="45" /></label>
          <label class="slider"><span class="label">Settling</span><output id="dampOut"></output>
            <input type="range" id="damp" min="0" max="100" value="40" /></label>
        </section>
        <section class="actions">
          <button class="btn primary" id="nudge" type="button" title="N">Nudge everything</button>
          <button class="btn" id="clear" type="button" title="C">Clear plate</button>
          <button class="btn" id="tilt" type="button" hidden>Tilt with phone</button>
        </section>
        <section class="toggles">
          <button class="toggle" id="slow" type="button" aria-pressed="false" title="S">¼ speed</button>
          <button class="toggle" id="mesh" type="button" aria-pressed="false" title="M">Lattice</button>
          <button class="toggle" id="pause" type="button" aria-pressed="false" title="Space">Pause</button>
        </section>
      </div>
    </aside>

    <p class="hint" id="hint">Drag a jelly to squish it. Drag the table to look around.</p>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
